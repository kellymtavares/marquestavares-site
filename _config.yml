# Configuração do site (GitHub Pages / Jekyll)
title: Marques Tavares Advocacia
description: Orientações sobre o patrimônio da família, do casamento à herança.
url: https://marquestavares.com.br
lang: pt-BR
timezone: America/Sao_Paulo
permalink: /blog/:title/
markdown: kramdown
exclude:
  - COMO-PUBLICAR.md
  - COMO-ESCREVER-NO-BLOG.md
  - COMO-LIGAR-O-CADASTRO.md
  - cadastro-apps-script.gs
  - COMO-LIGAR-AS-AVALIACOES.md
  - avaliacoes-apps-script.gs
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
